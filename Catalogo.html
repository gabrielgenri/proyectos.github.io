<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos Moderno</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Estilos generales y fuente Inter */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Fondo gris claro */
        }
        /* Definición de la cuadrícula de productos */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        /* Estilo para el hover de las tarjetas (elevación sutil) */
        .shadow-lg:hover {
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.1), 0 6px 15px -3px rgba(0, 0, 0, 0.05);
        }
        /* Limitar la descripción a 3 líneas */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Encabezado Fijo -->
    <header class="bg-blue-600 shadow-xl sticky top-0 z-10">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-3xl font-extrabold text-white mb-2 sm:mb-0">Catálogo de Inventario</h1>
            <span class="text-white text-lg font-medium opacity-90 p-2 bg-blue-700/50 rounded-lg">
                Total de Productos: <span id="product-count" class="font-bold text-yellow-300">0</span>
            </span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        
        <!-- Sección de Filtros -->
        <section class="mb-8 p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-3">Filtrar por Categoría</h2>
            <div id="category-filters" class="flex flex-wrap gap-3">
                <!-- Los botones de filtro se inyectarán aquí por JS -->
            </div>
        </section>

        <!-- Lista de Productos -->
        <section id="product-list" class="product-grid">
            <div class="col-span-full text-center p-8 text-xl text-blue-600 font-semibold">Cargando datos del catálogo...</div>
            <!-- Las tarjetas de productos se inyectarán aquí por JS -->
        </section>

        <!-- Mensaje de No Productos Encontrados -->
        <div id="no-products-message" class="hidden text-center p-12 bg-white rounded-2xl shadow-xl mt-8 border border-red-100">
            <svg class="mx-auto h-12 w-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-2xl text-gray-600 font-semibold mt-4">
                No se encontraron productos en esta categoría.
            </p>
            <p class="text-md text-gray-400 mt-2">Intenta seleccionar otro filtro.</p>
        </div>

    </main>

    <!-- Script de Lógica -->
    <script>
        // Esta URL apunta a la hoja de cálculo de Google publicada como CSV
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_VH8OtN4MiVPnU5DMYhi9mXlg2nlOTHd7z5kdWF_gkvg_nEUIUYk5Ra5_t2wilmYq8MIrbow05RWt/pub?gid=1431743291&single=true&output=csv";
        
        let allProducts = [];
        const productListEl = document.getElementById('product-list');
        const filtersEl = document.getElementById('category-filters');
        const productCountEl = document.getElementById('product-count');
        const noProductsMessageEl = document.getElementById('no-products-message');
        let currentFilter = 'Todos';

        /**
         * Convierte texto CSV en un arreglo de objetos.
         * Maneja comillas y diferentes formatos de terminación de línea.
         */
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) return [];
            
            // Regex robusta para dividir por comas, excepto si están dentro de comillas
            // Esto es crucial para manejar campos de descripción con comas internas.
            const splitRegex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;

            // Limpiar y obtener los encabezados
            const headerLine = lines[0];
            const headers = headerLine.split(splitRegex).map(h => h.trim().replace(/^"|"$/g, ''));
            
            const dataLines = lines.slice(1);

            return dataLines.map(line => {
                const values = line.split(splitRegex);
                let obj = {};
                // Función de limpieza: elimina espacios, comillas iniciales/finales y retornos de carro.
                const cleanValue = (val) => (val || '').trim().replace(/^"|"$/g, '').replace(/[\r]/g, ''); 
                
                headers.forEach((h, i) => { 
                    obj[h] = cleanValue(values[i]); 
                });
                return obj;
            }).filter(obj => obj.Nombre); // Filtrar filas donde el campo "Nombre" esté vacío
        }

        /**
         * Carga el CSV desde Google Sheets y arma allProducts[]
         * Implementa reintentos con backoff exponencial.
         */
        async function loadProducts() {
            // Mostrar mensaje de carga
            productListEl.innerHTML = '<div class="col-span-full text-center p-8 text-xl text-blue-600 font-semibold">Cargando datos del catálogo...</div>';

            const maxRetries = 3;
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(CSV_URL);
                    if (!response.ok) {
                        throw new Error(`Error HTTP: ${response.status}`);
                    }
                    const csvText = await response.text();
                    const rows = parseCSV(csvText);

                    // Mapear filas a la estructura de producto esperada, priorizando los campos según el CSV
                    allProducts = rows.map(row => {
                        // Priorizar la columna 'Imagen' para la URL, luego 'image'
                        const imageUrlField = row["Imagen"] || row["image"] || ""; 
                        // Priorizar la columna 'Precio' (Precio Público) o 'Precio Público (USD)'
                        const rawPrice = row["Precio"] || row["Precio Público (USD)"] || ''; 

                        return {
                            id: Number(row["ID"]) || 0,
                            name: row["Nombre"] || "Producto Desconocido",
                            description: row["Descripción"] || "Sin descripción disponible.",
                            category: row["Categoría"] || "General",
                            // Limpiamos el precio de símbolos ($,) y lo parseamos
                            price: parseFloat(rawPrice.replace(/[$,]/g, '')) || 0, 
                            // Solo usar la URL si es un enlace HTTP válido (asumiendo que las URLs en el CSV empiezan con http)   imageUrl: imageUrlField ? imageUrlField : ""
                             imageUrl: imageUrlField.startsWith('http') ? imageUrlField : ""
                        };
                    }).filter(p => p.name !== "Producto Desconocido");

                    setupFilters();
                    // Salir del bucle si la carga es exitosa
                    return; 

                } catch (error) {
                    // console.error(`Intento ${attempt + 1} fallido al cargar CSV:`, error); // No loguear retries
                    if (attempt < maxRetries - 1) {
                        const delay = Math.pow(2, attempt) * 1000; // 1s, 2s, 4s
                        await new Promise(resolve => setTimeout(resolve, delay));
                    } else {
                        // Después del último intento fallido
                        productListEl.innerHTML = `<div class="col-span-full text-center p-8 bg-red-100 rounded-xl">
                            <p class="text-xl text-red-700 font-semibold">
                                Error al cargar los datos. Por favor, verifica la URL del CSV o la estructura de la hoja de cálculo.
                            </p>
                            <p class="text-sm text-red-500 mt-2">Detalle: ${error.message}</p>
                        </div>`;
                        productCountEl.textContent = 'N/A';
                    }
                }
            }
        }

        /**
         * Genera la estructura HTML para una tarjeta de producto.         //const fallbackUrl = `https://placehold.co/400x300/1e40af/ffffff?text=${placeholderText}`;
         */
        function createProductCard(product) {
            // Generar URL de placeholder dinámico con el nombre del producto
            const placeholderText = product.name ? encodeURIComponent(product.name.substring(0, 20).trim()) : 'Producto';
            const fallbackUrl = `https://placehold.co/400x300/1e40af/ffffff?text=${placeholderText}`;
 
            
            // Usar la URL de la hoja o el placeholder si está vacía
            const imageUrl = product.imageUrl || fallbackUrl;

            return `
                <div class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col transform hover:-translate-y-1 border border-gray-100">
                    <div class="h-48 bg-gray-100 overflow-hidden flex items-center justify-center">
                        <img 
                            src="${imageUrl}"
                            alt="Imagen de ${product.name}"
                            class="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
                            onerror="this.onerror=null; this.src='https://placehold.co/400x300/1e40af?text=Imagen+No+Disp.'; this.classList.remove('hover:scale-105');"
                        >
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="text-xl font-extrabold text-gray-900 mb-2">${product.name}</h3>
                        <span class="inline-block self-start bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full mb-3 shadow-sm">
                            ${product.category}
                        </span>
                        <p class="text-gray-600 text-sm mb-4 flex-grow line-clamp-3">${product.description}</p>
                        <div class="pt-4 border-t border-gray-100 mt-auto flex justify-between items-center">
                            <div>
                                <p class="text-3xl font-black text-blue-600">
                                    $${product.price.toFixed(2)} 
                                </p>
                                <p class="text-sm text-gray-500 mt-1">Precio</p>
                                 <p class="text-sm text-gray-500 mt-1">https://gabrielgenri.github.io/proyectos.github.io/${imageUrl}</p>
                            </div>
                            <button class="bg-blue-500 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-blue-700 transition-colors duration-200 shadow-md">
                                Ver Detalle
                            </button>
                        </div>
                    </div>
                </div>
                 
            `;
        }

        /**
         * Filtra y renderiza los productos en la vista.
         */
        function renderProducts(category) {
            currentFilter = category;
            const filtered = category === 'Todos'
                ? allProducts
                : allProducts.filter(p => p.category === category);

            productCountEl.textContent = filtered.length;
            productListEl.innerHTML = filtered.map(createProductCard).join('');

            // Muestra u oculta el mensaje de "No productos"
            noProductsMessageEl.classList.toggle('hidden', filtered.length > 0);
            updateFilterButtons();
        }

        /**
         * Crea y añade los botones de filtro al DOM.
         */
        function setupFilters() {
            // Asegúrate de que 'Todos' sea la primera opción
            const categories = ['Todos', ...new Set(allProducts.map(p => p.category).filter(c => c))];
            filtersEl.innerHTML = "";
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.textContent = category;
                button.setAttribute('data-category', category);
                button.className = 'filter-btn px-4 py-2 rounded-full font-semibold text-sm transition-all duration-200 shadow-md whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50';
                
                // Función para manejar el clic y re-renderizar
                button.addEventListener('click', () => renderProducts(category));
                filtersEl.appendChild(button);
            });

            // Iniciar la renderización con el filtro actual ('Todos' por defecto)
            renderProducts(currentFilter);
        }

        /**
         * Actualiza el estilo de los botones para indicar el filtro activo.
         */
        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(button => {
                const cat = button.getAttribute('data-category');
                if (cat === currentFilter) {
                    // Estilo Activo: Azul con texto blanco
                    button.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700');
                    button.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                } else {
                    // Estilo Inactivo: Gris claro con texto gris oscuro
                    button.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    button.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-700');
                }
            });
        }

        // Cargar los productos tan pronto como el DOM esté listo
        document.addEventListener("DOMContentLoaded", loadProducts);
    </script>

</body>
</html>
